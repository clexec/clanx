name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications/ | grep '^Xcode' | grep '\.app$' | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "/Applications/$XCODE"
          xcodebuild -version

      - name: Stub YMAPI-dependent files
        working-directory: clanx
        run: |
          cat > Monk/Services/Stream/YandexMusicClient.swift << 'SWIFT'
          import Foundation
          final class YandexMusicClient {
              static let shared = YandexMusicClient()
              let client: AnyObject? = nil
              private init() {}
          }
          SWIFT

          cat > Monk/Services/Stream/YandexStreamResolver.swift << 'SWIFT'
          import Foundation
          struct YandexStreamResolver: StreamResolving {
              let source: MusicSource = .yandex
              init?() { return nil }
              func resolveStreamURL(for track: Track) async -> URL? { nil }
          }
          SWIFT

      - name: Archive
        working-directory: clanx
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Monk.xcodeproj \
            -scheme Monk \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Monk.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild.log
          echo "--- Archive check ---"
          ls "$RUNNER_TEMP/Monk.xcarchive/Products/Applications/" 2>/dev/null || echo "No archive"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 7

      - name: Create unsigned IPA
        run: |
          APPS_PATH="$RUNNER_TEMP/Monk.xcarchive/Products/Applications"
          IPA_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APPS_PATH/Monk.app" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -r Monk.ipa Payload/
          echo "IPA size: $(ls -lh Monk.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Monk-unsigned
          path: ${{ runner.temp }}/ipa/Monk.ipa
          retention-days: 14
