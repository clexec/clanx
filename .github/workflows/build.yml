name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Archive
        run: |
          xcodebuild archive \
            -project mono/ios-spotifyclone/SpotifyClone.xcodeproj \
            -scheme SpotifyClone \
            -configuration Release \
            -archivePath $RUNNER_TEMP/SpotifyClone.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Create IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/SpotifyClone.xcarchive/Products/Applications/SpotifyClone.app" \
                "$RUNNER_TEMP/Payload/SpotifyClone.app"
          cd $RUNNER_TEMP
          zip -r SpotifyClone.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyClone
          path: ${{ runner.temp }}/SpotifyClone.ipa
