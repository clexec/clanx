name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Stub package-dependent files for CI
        run: |
          cat > Monk/Services/Stream/YandexMusicClient.swift << 'SWIFT'
          import Foundation
          final class YandexMusicClient {
              static let shared = YandexMusicClient()
              let client: AnyObject? = nil
              private init() {}
          }
          SWIFT

          cat > Monk/Services/Stream/YandexStreamResolver.swift << 'SWIFT'
          import Foundation
          struct YandexStreamResolver: StreamResolving {
              let source: MusicSource = .yandex
              init?() { return nil }
              func resolveStreamURL(for track: Track) async -> URL? { nil }
          }
          SWIFT

          cat > Monk/Services/Stream/YouTubeStreamResolver.swift << 'SWIFT'
          import Foundation
          struct YouTubeStreamResolver: StreamResolving {
              let source: MusicSource = .youtube
              func resolveStreamURL(for track: Track) async -> URL? { nil }
          }
          SWIFT

      - name: Build Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Monk.xcodeproj \
            -scheme Monk \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Monk.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log
          echo "--- Archive check ---"
          ls -la "$RUNNER_TEMP/Monk.xcarchive/Products/Applications/" 2>/dev/null || echo "No archive"

      - name: Create unsigned IPA
        run: |
          APPS_PATH="$RUNNER_TEMP/Monk.xcarchive/Products/Applications"
          IPA_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APPS_PATH/Monk.app" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -r Monk.ipa Payload/
          echo "IPA: $(ls -lh Monk.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Monk-unsigned
          path: ${{ runner.temp }}/ipa/Monk.ipa
          retention-days: 14
