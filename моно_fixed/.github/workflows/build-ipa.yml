name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app
    
    - name: Build Archive
      run: |
        cd ios-spotifyclone
        xcodebuild -project SpotifyClone.xcodeproj \
          -scheme SpotifyClone \
          -configuration Release \
          -archivePath build/SpotifyClone.xcarchive \
          -destination 'generic/platform=iOS' \
          archive
    
    - name: Export IPA
      run: |
        cd ios-spotifyclone
        xcodebuild -exportArchive \
          -archivePath build/SpotifyClone.xcarchive \
          -exportPath build \
          -exportOptionsPlist exportOptions.plist
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: SpotifyClone-IPA
        path: ios-spotifyclone/build/*.ipa
