  <script>
    // Ensure AudioContext resumes and audio plays at full volume after user click
    document.addEventListener('click', function resume() {
      var ctx = window.__audioContext;
      if (ctx && ctx.state === 'suspended') ctx.resume();
      var audio = document.querySelector('audio');
      if (audio && audio.volume < 0.1 && !audio.paused) audio.volume = 0.8;
    }, { passive: true });
  </script>
